    conditions:
    - !type:SS220AmbitionRequiredThiefRole
    - !type:SS220AmbitionRequiredSpecies
      species:
      - Tajaran
      - Felinid
    name: ss220-ambition-thief-carcat-mischief-name
    desc: ss220-ambition-thief-carcat-mischief-desc

- type: entity
