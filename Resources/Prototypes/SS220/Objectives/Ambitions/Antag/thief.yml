- type: entity
  parent: SS220BaseAmbitionObjective
  id: SS220BaseThiefAmbition
  abstract: true
  components:
  - type: SS220AmbitionObjective
    conditions:
    - !type:SS220AmbitionRequiredThiefRole
    weight: 3 #Antag ambitions are fun!!

- type: entity
  parent: SS220BaseThiefAmbition
  id: SS220AmbitionThiefVengeance
  components:
  - type: SS220AmbitionObjective
    name: ss220-ambition-thief-vengeance-name
    desc: ss220-ambition-thief-vengeance-desc
    parsings:
      NAME: !type:SS220AmbitionRandomOtherPerson

- type: entity
  parent: SS220BaseThiefAmbition
  id: SS220AmbitionThiefFelineMischief
  components:
