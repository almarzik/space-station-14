- type: entity
  parent: SS220BaseAmbitionObjective
  abstract: true
  id: SS220BaseFelineAmbition
  components:
  - type: SS220AmbitionObjective
    conditions:
    - !type:SS220AmbitionRequiredSpecies
      species:
      - Tajaran
      - Felinid

- type: entity
  parent: SS220BaseFelineAmbition
