      species:
      - Tajaran
      - Felinid
      - Vox
    name: ss220-ambition-territorial-marks-name
    desc: ss220-ambition-territorial-marks-desc
    weight: 2
    parsings:
      LOCATION: !type:SS220AmbitionRandomLocation

